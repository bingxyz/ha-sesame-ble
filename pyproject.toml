[project]
name = "ha-sesame-ble"
version = "0.1.0"
description = "Local Home Assistant BLE integration for CANDY HOUSE SESAME locks"
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
dev = [
  "aioesphomeapi>=45.6.2",
  "aiousbwatcher>=1.1.2",
  "gomalock",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "pytest-mock",
  "ruff",
  "serialx>=1.8.2",
]

[tool.uv.sources]
gomalock = { path = "../gomalock", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
follow_imports = "skip"
