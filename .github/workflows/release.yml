name: Release

run-name: Release check for ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    paths:
      - custom_components/sesame_ble/manifest.json
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run releases from the main branch, not $GITHUB_REF."
            exit 1
          fi

      - name: Check out ha-sesame-ble
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: ha-sesame-ble

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
          working-directory: ha-sesame-ble

      - name: Validate and detect a version change
        id: release
        working-directory: ha-sesame-ble
        shell: bash
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          root = Path.cwd()
          manifest_path = "custom_components/sesame_ble/manifest.json"
          version = json.loads((root / manifest_path).read_text())["version"]
          project = tomllib.loads((root / "pyproject.toml").read_text())
          lock = tomllib.loads((root / "uv.lock").read_text())

          version_pattern = (
              r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
          )
          if re.fullmatch(version_pattern, version) is None:
              raise SystemExit(
                  f"Invalid version {version!r}; use a semantic version such as 0.1.3."
              )

          lock_versions = {
              package["version"]
              for package in lock["package"]
              if package["name"] == "ha-sesame-ble"
          }
          versions = {
              manifest_path: version,
              "pyproject.toml": project["project"]["version"],
          }
          if len(lock_versions) == 1:
              versions["uv.lock"] = lock_versions.pop()
          else:
              versions["uv.lock"] = f"unexpected entries: {sorted(lock_versions)}"

          mismatches = {
              filename: found
              for filename, found in versions.items()
              if found != version
          }
          if mismatches:
              details = ", ".join(
                  f"{filename}={found}" for filename, found in mismatches.items()
              )
              raise SystemExit(
                  f"Version {version} does not match every version file: {details}"
              )

          tag = f"v{version}"
          if subprocess.run(
              ["git", "show-ref", "--verify", "--quiet", f"refs/tags/{tag}"],
              check=False,
          ).returncode == 0:
              should_release = False
              reason = f"{tag} already exists; there is nothing to publish."
          else:
              released_versions = [
                  tuple(map(int, existing_tag.removeprefix("v").split(".")))
                  for existing_tag in subprocess.run(
                      ["git", "tag", "--list", "v[0-9]*"],
                      check=True,
                      capture_output=True,
                      text=True,
                  ).stdout.splitlines()
                  if re.fullmatch(f"v{version_pattern}", existing_tag)
              ]
              current_version = tuple(map(int, version.split(".")))
              if released_versions and current_version <= max(released_versions):
                  raise SystemExit(
                      f"Version {version} must be newer than the latest released "
                      f"version {'.'.join(map(str, max(released_versions)))}."
                  )
              should_release = True
              reason = f"Validated {tag}; continue with release checks."

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a") as output:
              print(f"version={version}", file=output)
              print(
                  f"should_release={str(should_release).lower()}",
                  file=output,
              )

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a") as summary:
              print("## Release detection", file=summary)
              print(file=summary)
              print(reason, file=summary)

          print(reason)
          PY

      - name: Check out the pinned gomalock fork
        if: steps.release.outputs.should_release == 'true'
        uses: actions/checkout@v6
        with:
          repository: bingxyz/gomalock
          ref: 005d7c4c7ad9b343841ef48b63f86da69eba2679
          path: gomalock

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: uv sync --frozen
        working-directory: ha-sesame-ble

      - name: Run tests
        if: steps.release.outputs.should_release == 'true'
        run: uv run pytest
        working-directory: ha-sesame-ble

      - name: Run Ruff
        if: steps.release.outputs.should_release == 'true'
        run: uv run ruff check .
        working-directory: ha-sesame-ble

      - name: Run mypy
        if: steps.release.outputs.should_release == 'true'
        run: uv run mypy custom_components
        working-directory: ha-sesame-ble

      - name: Verify main has not moved
        if: steps.release.outputs.should_release == 'true'
        working-directory: ha-sesame-ble
        shell: bash
        run: |
          git fetch origin main
          current_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$current_sha" != "$main_sha" ]]; then
            echo "::error::main moved from $current_sha to $main_sha during validation."
            echo "::error::Run the release workflow again from the latest main."
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        working-directory: ha-sesame-ble
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          current_sha="$(git rev-parse HEAD)"
          gh release create "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$current_sha" \
            --title "Sesame BLE v${RELEASE_VERSION}" \
            --notes "Update Sesame BLE from HACS and restart Home Assistant. Existing devices, credentials, entities, and automations require no changes." \
            --generate-notes
